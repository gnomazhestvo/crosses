{% extends "base.html" %}

{% block title %}Лидерборд — SNKR.RANK{% endblock %}

{% block content %}
<h1 class="page-title">🏆 Лидерборд</h1>

    <!-- Добавь ещё карточки через цикл -->
    {% for shoe in shoes %}
    <div class="col-md-6 col-lg-4">
        <div class="card-sneaker">
            <img src="{{ shoe.image }}" alt="{{ shoe.title }}">
            <div class="p-4">
                <h5 class="fw-bold">{{ shoe.title }}</h5>
                <div class="d-flex gap-2 mb-2">
                    <span class="badge-male">👞 муж. ¥{{ shoe.price_male }}</span>
                    <span class="badge-female">👠 жен. ¥{{ shoe.price_princess }}</span>
                </div>
                <p class="text-muted small">{{ shoe.description[:60] }}...</p>
                <a href="{{ shoe.source }}" class="btn btn-primary-custom w-100 btn-sm" target="_blank">Смотреть</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
