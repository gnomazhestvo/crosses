<div class="card card-hub card-sneaker h-100" style="background-image: url('{{ shoe.image }}'); min-height: 450px;">
    
    <!-- Рейтинг -->
    <span class="rating-badge">★ {{ shoe.rating }} Рейтинг</span>
    
    <!-- Информация -->
    <div>
        <div class="sneaker-brand mb-1">{{ shoe.title.split(' ')[0] }}</div>
        <div class="sneaker-name mb-4" style="font-size: 22px;">{{ shoe.title }}</div>
        
        <form method="POST" action="{{ url_for('vote_view', winner_id=shoe.id, loser_id=other_shoe.id) }}">
            <button type="submit" class="btn btn-accent w-100">
                Выбрать этот силуэт
            </button>
        </form>
    </div>
    
</div>
